<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M/S Silja Serenade — Reittivalot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --wood-dark:#2a170c;
    --wood-mid:#5c3a20;
    --wood-light:#8a5a34;
    --brass:#c9a862;
    --brass-dim:#8a7143;
    --ink:#3a2b18;
    --bulb-off:#3a2f22;
    --bulb-rim:#6b5a3e;
    --green:#3ecf6b;
    --red:#ff4433;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at center, #1b120a 0%, #0c0805 100%);
    font-family:Georgia, 'Times New Roman', serif;
  }
  body{
    padding:24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    position:relative;
    width:100%;
    max-width:1180px;
    padding:22px;
    border-radius:14px;
    background:
      linear-gradient(155deg, var(--wood-light), var(--wood-mid) 45%, var(--wood-dark) 100%);
    box-shadow:
      0 0 0 2px var(--brass-dim),
      0 18px 40px rgba(0,0,0,.6),
      inset 0 0 30px rgba(0,0,0,.5);
  }
  .frame::before{
    content:"";
    position:absolute; inset:10px;
    border:2px solid var(--brass);
    border-radius:8px;
    pointer-events:none;
    box-shadow:inset 0 0 12px rgba(0,0,0,.4);
    opacity:.7;
    z-index:1000;
  }
  .panel{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    box-shadow:inset 0 0 60px rgba(0,0,0,.55);
  }
  #leafletMap{
    width:100%;
    aspect-ratio:900/480;
    background:#a8d0e6;
    cursor:default;
  }
  .leaflet-control-attribution{
    font-size:.6rem !important;
    background:rgba(233,220,184,.85) !important;
  }

  .plate{
    position:absolute;
    right:16px; bottom:14px;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(160deg, #e9dcb8, #d3c298);
    border:1px solid var(--brass-dim);
    border-radius:4px;
    padding:6px 12px;
    box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 0 4px rgba(255,255,255,.4);
    z-index:1000;
  }
  .lamp{
    width:9px; height:9px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px var(--green), inset 0 0 2px rgba(255,255,255,.6);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .lamp.off{ background:var(--red); box-shadow:0 0 6px var(--red), inset 0 0 2px rgba(255,255,255,.6); animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .plate span{
    font-size:.72rem;
    letter-spacing:1px;
    color:var(--ink);
    font-family:'Courier New', monospace;
    font-weight:bold;
  }

  .bulb-off{ fill:var(--bulb-off) !important; stroke:var(--bulb-rim) !important; stroke-width:1 !important; }
  .bulb-lit{ fill:url(#bulbGrad) !important; stroke:none !important; filter:url(#bulbGlow); }
  .bulb-current{ fill:url(#bulbGrad) !important; stroke:none !important; filter:url(#bulbGlow); animation:blinkBulb 1s steps(1,end) infinite; }
  @keyframes blinkBulb{ 0%,49%{ opacity:1; } 50%,100%{ opacity:.12; } }
</style>
</head>
<body>

<div class="frame">
  <div class="panel">
    <div id="leafletMap"></div>

    <div class="plate">
      <span class="lamp" id="statusLamp"></span>
      <span id="statusText">AIS-YHTEYS</span>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="bulbGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="35%" stop-color="#ff6a3c"/>
      <stop offset="100%" stop-color="#7a0e08"/>
    </radialGradient>
    <filter id="bulbGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  const MMSI = 230184000;
  const API_URL = 'https://meri.digitraffic.fi/api/ais/v1/locations?mmsi=' + MMSI;

  // Helsinki -> Maarianhamina -> Tukholma, [lon, lat]
  const ROUTE_LONLAT = [
    [24.9530, 60.1553], // Helsinki
    [24.1000, 59.8450], // Porkkala
    [22.9500, 59.7500], // avomeri
    [20.9000, 59.8500], // Ahvenanmaan lähestyminen
    [20.3000, 60.0200], // Föglön salmi
    [19.9350, 60.0971], // Maarianhamina
    [19.4500, 59.6500], // Lågskär
    [18.9000, 59.3000], // Tukholman saariston lähestyminen
    [18.3500, 59.3800], // sisäsaaristo
    [18.1090, 59.3554]  // Tukholma
  ];

  const map = L.map('leafletMap', {
    zoomControl:false, dragging:false, scrollWheelZoom:false,
    doubleClickZoom:false, touchZoom:false, boxZoom:false,
    keyboard:false, tap:false, attributionControl:true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const bounds = L.latLngBounds(ROUTE_LONLAT.map(([lon,lat]) => [lat,lon]));
  map.fitBounds(bounds, { padding:[26,26] });

  // pehmennetty reitti catmull-rom -splinillä (lon/lat-tasossa)
  function catmullRomPoint(p0,p1,p2,p3,t){
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    const mt = 1-t;
    const x = mt*mt*mt*p1[0] + 3*mt*mt*t*c1x + 3*mt*t*t*c2x + t*t*t*p2[0];
    const y = mt*mt*mt*p1[1] + 3*mt*mt*t*c1y + 3*mt*t*t*c2y + t*t*t*p2[1];
    return [x,y];
  }
  function buildDense(points, samplesPerSeg){
    const dense = [];
    for (let i=0;i<points.length-1;i++){
      const p0 = points[i===0?i:i-1], p1=points[i], p2=points[i+1], p3=points[i+2<points.length?i+2:i+1];
      for (let s=0;s<samplesPerSeg;s++) dense.push(catmullRomPoint(p0,p1,p2,p3,s/samplesPerSeg));
    }
    dense.push(points[points.length-1]);
    return dense;
  }

  const DENSE = buildDense(ROUTE_LONLAT, 16); // [lon,lat]
  const latRef = 59.8 * Math.PI/180;
  function localDist(a, b){
    const dx = (b[0]-a[0]) * 111320 * Math.cos(latRef);
    const dy = (b[1]-a[1]) * 111320;
    return Math.hypot(dx, dy);
  }

  const segLens = [];
  let totalLen = 0;
  for (let i=0;i<DENSE.length-1;i++){ const d = localDist(DENSE[i],DENSE[i+1]); segLens.push(d); totalLen += d; }

  L.polyline(DENSE.map(([lon,lat])=>[lat,lon]), { color:'#1a120a', weight:1.5, opacity:.5 }).addTo(map);

  const BULB_COUNT = 46;
  const bulbs = [];
  for (let i=0;i<BULB_COUNT;i++){
    const targetDist = (i/(BULB_COUNT-1)) * totalLen;
    let acc = 0, idx = 0;
    while (idx < segLens.length && acc + segLens[idx] < targetDist){ acc += segLens[idx]; idx++; }
    const segFrac = segLens[idx] ? (targetDist - acc) / segLens[idx] : 0;
    const a = DENSE[idx], b = DENSE[Math.min(idx+1, DENSE.length-1)];
    const lon = a[0] + (b[0]-a[0])*segFrac;
    const lat = a[1] + (b[1]-a[1])*segFrac;
    const marker = L.circleMarker([lat, lon], { radius:4.2, className:'bulb-off', weight:1, fillOpacity:1 }).addTo(map);
    bulbs.push(marker);
  }

  function progressFromLonLat(lon, lat){
    let best = Infinity, bestFrac = 0, acc = 0;
    for (let i=0;i<DENSE.length-1;i++){
      const a = DENSE[i], b = DENSE[i+1];
      const abx = (b[0]-a[0]) * 111320 * Math.cos(latRef), aby = (b[1]-a[1]) * 111320;
      const pxx = (lon-a[0]) * 111320 * Math.cos(latRef), pyy = (lat-a[1]) * 111320;
      const len2 = abx*abx + aby*aby;
      let t = len2 === 0 ? 0 : (pxx*abx + pyy*aby) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = abx*t, cy = aby*t;
      const d2 = (pxx-cx)**2 + (pyy-cy)**2;
      if (d2 < best){ best = d2; bestFrac = (acc + t*segLens[i]) / totalLen; }
      acc += segLens[i];
    }
    return Math.max(0, Math.min(1, bestFrac));
  }

  // reitin suunta (Helsinki->Tukholma) kohdassa "progress", jotta nahdaan
  // kumpaan suuntaan laiva todellisuudessa kulkee verrattuna AIS-kurssiin
  function bearingDeg(a, b){
    const dx = (b[0]-a[0]) * Math.cos(latRef);
    const dy = (b[1]-a[1]);
    return (Math.atan2(dx, dy) * 180/Math.PI + 360) % 360;
  }
  function routeTangentBearing(progress){
    const targetDist = progress * totalLen;
    let acc = 0, idx = 0;
    while (idx < segLens.length && acc + segLens[idx] < targetDist){ acc += segLens[idx]; idx++; }
    const a = DENSE[idx], b = DENSE[Math.min(idx+1, DENSE.length-1)];
    return bearingDeg(a, b);
  }

  // reversed=true kun laiva kulkee Tukholmasta Helsinkiin: tallennettu
  // reitti kulkee aina Helsinki->Tukholma-jarjestyksessa, joten "kuljettu"
  // puoli on silloin lampun yla- eika alapuolella
  function lightBulbs(progress, reversed){
    const currentIdx = Math.round(progress * (BULB_COUNT - 1));
    bulbs.forEach((m, i) => {
      let cls;
      if (i === currentIdx) cls = 'bulb-current';
      else if (reversed ? i > currentIdx : i < currentIdx) cls = 'bulb-lit';
      else cls = 'bulb-off';
      if (m._path) m._path.setAttribute('class', 'leaflet-interactive ' + cls);
    });
  }

  const statusLamp = document.getElementById('statusLamp');
  const statusText = document.getElementById('statusText');

  async function fetchLive(){
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(API_URL, { signal: ctrl.signal, cache:'no-store' });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const f = data.features && data.features[0];
      if (!f){
        statusLamp.classList.add('off');
        statusText.textContent = 'EI KATTAVUUTTA';
        return;
      }
      const [lon, lat] = f.geometry.coordinates;
      const progress = progressFromLonLat(lon, lat);
      const headingRaw = f.properties.heading;
      const shipHeading = (headingRaw === 511 || headingRaw === undefined) ? f.properties.cog : headingRaw;
      const tangent = routeTangentBearing(progress);
      const diff = ((shipHeading - tangent + 540) % 360) - 180;
      const reversed = Math.abs(diff) > 90;
      lightBulbs(progress, reversed);
      statusLamp.classList.remove('off');
      statusText.textContent = 'AIS-YHTEYS AKTIIVINEN';
    } catch (err){
      statusLamp.classList.add('off');
      statusText.textContent = 'EI YHTEYTTÄ';
    }
  }

  setTimeout(() => { map.invalidateSize(); }, 50);
  setInterval(fetchLive, 60000);
  fetchLive();
})();
</script>
</body>
</html>
